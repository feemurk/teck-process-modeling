## SECTION 5: OPEN ITEMS

open_items:
  - id: "OI-001"
    entity_name: "haul_cycle"
    field_path: "entities[haul_cycle].process_model_overrides; event_canvas[haul_cycle].measures[Queue-at-Dump Duration, Spot-at-Dump Duration]"
    description: "queue_dump_start_utc and spot_dump_utc were added to haul_cycle during this workshop to close an auditability gap (see the entity's process_model_overrides note), but their actual existence in FMS has not been confirmed. If FMS does not capture these as discrete events, the queue-at-dump and spot-at-dump measures cannot be computed as designed and must either fall back to a coarser dump_utc-only measure, or be sourced from the haul_cycle_stage_event entity if that entity turns out to have a real source (see OI-002)."
    gate_impact: "block-stage2"
    owner: "FMS system owner (name TBC)"
    target_date: "TBC"
    status: "open"

  - id: "OI-002"
    entity_name: "haul_cycle_stage_event"
    field_path: "entities[haul_cycle_stage_event].natural_key.key_stability_notes; entities[haul_cycle_stage_event].source_systems"
    description: "Whether FMS emits a real discrete event per haul cycle lifecycle stage, or whether this entity must be synthetically derived from haul_cycle's own timestamp columns, is unconfirmed. This determines whether haul_cycle_stage_event is a genuine Raw-sourced Curated entity or a purely computed view — a materially different build."
    gate_impact: "block-stage2"
    owner: "FMS system owner (name TBC)"
    target_date: "TBC"
    status: "open"

  - id: "OI-003"
    entity_name: "delay_event"
    field_path: "entities[delay_event].source_systems[0].known_quality_issues; event_canvas[delay_event].tum_classification_rules"
    description: "work_order_id is not enforced as a linkage on TUM:DT delay_event records at source. This is Gap XP-01 in the programme Gap Register — described there as the single most critical cross-pillar linkage gap in the programme, and as fundamentally limiting the (Contextualized) MFD data product without it."
    gate_impact: "warn-stage2"
    owner: "Joint Pillar 2 + Pillar 5 BEAM workshop decision, per Gap XP-01's stated resolution path"
    target_date: "TBC"
    status: "open"

  - id: "OI-004"
    entity_name: "haul_cycle"
    field_path: "event_canvas[haul_cycle].measures[Payload Delivered].computation_rule"
    description: "Strut-pressure-to-payload calibration factor ownership and documentation location is not established — pillar model Known Gap G2."
