# beam-overlay.yaml — mobile-fleet-data-training-mock
# Generated per templates/beam-overlay-schema.yaml
#
# ============================================================================
# TRAINING MOCK — NOT A PRODUCTION ARTIFACT.
# ============================================================================
# Generated without live stakeholder engagement, at the requester's explicit direction,
# to illustrate real Stage 1 file shapes and the Curated/Contextualized DDVC boundary for
# a data-modeler training exercise. Two deliberate shortcuts were taken throughout, per
# explicit instruction, and are NOT how a real BEAM workshop should be run:
#   1. Every natural_key is assumed to be the documented system identifier field, assumed
#      stable, with no per-entity source-system stability probing.
#   2. Every entity (including Transactional/event entities) is given scd_policy: Type2 on
#      its full attribute set, on the stated rationale that a Type-1 current-state view can
#      always be derived from a Type-2 history table, and that event tables are not
#      guaranteed immutable at the source (FMS allows edits/corrections to already-recorded
#      events), so append-only would silently lose that audit trail.
# domain_owner fields are role-based placeholders, not named/confirmed individuals, and are
# marked status: provisional throughout — nobody actually confirmed ownership.
#
# Section 7 is a NON-STANDARD ADDITION beyond this schema. CLAUDE.md states plainly that
# KPI definitions/metric calculations belong to Stage 2, not this repo — Section 7 exists
# here anyway, at explicit request, specifically so a training audience can see how a
# Contextualized layer is built on top of a Curated one in one file. Do not treat Section 7
# as a template for a real overlay.
# ============================================================================

