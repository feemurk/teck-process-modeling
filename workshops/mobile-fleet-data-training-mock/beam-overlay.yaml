---
## SECTION 3: EVENT CANVAS OUTPUTS

event_canvas:

  - entity_name: "haul_cycle"
    primary_business_event: "Haul Cycle Completed"
    event_timestamp_source: "FMS (Minestar dispatch module)"
    event_timestamp_field: "return_end_utc (cycle close event)"

    measures:
      - measure_name: "Payload Delivered"
        teck_term: "Load weight"
        business_definition: "The estimated mass of material delivered to destination in one haul cycle, derived from strut pressure telemetry at load completion."
        unit_of_measure: "tonnes"
        uom_suffix: "_wmt"
        additivity: "additive"
        additivity_notes: ""
        source_system: "PI Historian (strut pressure telemetry) via FMS"
        source_field: "payload_est_t"
        raw_or_computed: "computed"
        computation_rule: "Strut pressure readings (front/rear axle) converted to mass via a manufacturer-supplied, per-equipment-class calibration model. Calibration factor ownership/documentation is Known Gap G2 in the pillar model — not resolved in this mock."
        business_rule_notes: "Wet mass tonnes (_wmt) — moisture correction to dry tonnes not applied at this grain; see Known Gap G2 and the pillar model's commodity variation note on wet-vs-dry tonnage."
        open_items: ["Strut-pressure calibration factor source/ownership not documented — see open_items OI-004"]
        status: "provisional"

      - measure_name: "Queue-at-Shovel Duration"
        teck_term: "Queue time"
        business_definition: "Elapsed time from truck arrival at the dig face queue to shovel-side spot start."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "spot_shovel_utc − queue_shovel_start_utc"
        raw_or_computed: "computed"
        computation_rule: "spot_shovel_utc minus queue_shovel_start_utc"
        business_rule_notes: "Classified TUM: OD (brief, inherent) or TUM: SBO (management decision) per the decision table in tum_classification_rules below — this classification, not the raw duration, is the analytically significant output."
        open_items: []
        status: "confirmed"

      - measure_name: "Spot-at-Shovel Duration"
        business_definition: "Elapsed time from queue exit to first bucket contact at the shovel."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "load_start_utc − spot_shovel_utc"
        raw_or_computed: "computed"
        computation_rule: "load_start_utc minus spot_shovel_utc"
        business_rule_notes: "TUM: NP (non-productive operating time)."
        open_items: []
        status: "confirmed"

      - measure_name: "Load Duration"
        business_definition: "Elapsed time of active loading, from first bucket pass to last."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS; PI Historian (pass count)"
        source_field: "load_end_utc − load_start_utc"
        raw_or_computed: "computed"
        computation_rule: "load_end_utc minus load_start_utc"
        business_rule_notes: "TUM: PT for shovel, TUM: WT for truck — the same wall-clock interval carries two different TUM roles depending on which equipment_id the measure is attributed to."
        open_items: []
        status: "confirmed"

      - measure_name: "Loaded Haul Duration"
        business_definition: "Elapsed time of the loaded travel segment from the dig face to the destination."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS; GPS/GNSS"
        source_field: "queue_dump_start_utc − haul_start_utc"
        raw_or_computed: "computed"
        computation_rule: "queue_dump_start_utc (proposed field — see process_model_overrides on haul_cycle) minus haul_start_utc. If queue_dump_start_utc is not actually available at source, this falls back to dump_utc minus haul_start_utc, which conflates loaded-haul with queue-at-dump — an accuracy loss to flag as an open item."
        business_rule_notes: "TUM: WT (productive)."
        open_items: ["Depends on queue_dump_start_utc actually existing at source — see open_items OI-001"]
        status: "provisional"

      - measure_name: "Queue-at-Dump Duration"
        business_definition: "Elapsed time from arrival at the destination queue to reaching dump spot position."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "spot_dump_utc − queue_dump_start_utc"
        raw_or_computed: "computed"
        computation_rule: "spot_dump_utc minus queue_dump_start_utc (both proposed fields — see open_items OI-001)"
        business_rule_notes: "Classified TUM: OD or TUM: SBO — the destination-side mirror of the shovel-side queue classification, per the process narrative's 2.2.3.2 gateway."
        open_items: ["Cannot be computed until queue_dump_start_utc and spot_dump_utc are confirmed available at source — see open_items OI-001"]
        status: "needs-workshop"

      - measure_name: "Spot-at-Dump Duration"
        business_definition: "Elapsed time from dump queue exit to dump position reached."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "dump_utc − spot_dump_utc"
        raw_or_computed: "computed"
        computation_rule: "dump_utc minus spot_dump_utc (spot_dump_utc is a proposed field — see open_items OI-001)"
        business_rule_notes: "TUM: NP."
        open_items: ["Depends on spot_dump_utc — see open_items OI-001"]
        status: "needs-workshop"

      - measure_name: "Empty Return Duration"
        business_definition: "Elapsed time of the empty travel segment from destination back to the next assigned face."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS; GPS/GNSS"
        source_field: "return_end_utc − dump_utc"
        raw_or_computed: "computed"
        computation_rule: "return_end_utc minus dump_utc"
        business_rule_notes: "TUM: NP, with brief TUM: OD sub-segments possible for fuelling/operator change per the process narrative — not separately measured at this grain."
        open_items: []
        status: "confirmed"

      - measure_name: "Total Cycle Duration"
        business_definition: "Total elapsed time of the complete haul cycle, queue-at-shovel through return."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "semi-additive"
        additivity_notes: "Additive across distinct haul_cycle instances (can sum total cycle-seconds across a shift), but not meaningfully additive across overlapping/parallel cycles from different trucks at the same moment — a fleet-level 'total cycle time' is not a proxy for elapsed shift time."
        source_system: "FMS"
        source_field: "return_end_utc − queue_shovel_start_utc"
        raw_or_computed: "computed"
        computation_rule: "return_end_utc minus queue_shovel_start_utc; equivalently the sum of all stage durations above"
        business_rule_notes: ""
        open_items: []
        status: "confirmed"

    reason_code_vocabulary: []

    tum_classification_rules:
      - observable_condition: "Truck queued at shovel or destination for a brief, operationally inherent wait (e.g. shovel finishing prior truck's load)"
        correct_tum_category: "OD"
        decision_authority: "FMS auto-classification against a site OD/SBO threshold, confirmed by mine controller"
        common_misclassification: "Classified as SBO when it is actually a brief, inherent queue — inflates apparent management-caused standby"
        escalation_path: "Mine controller review if queue duration approaches the site threshold and cause is ambiguous"
      - observable_condition: "Truck queued for 45 minutes at an offline/shut-down crusher awaiting restart — a management decision, not an inherent operational wait"
        correct_tum_category: "SBO"
        decision_authority: "Mine controller, explicit classification required — this is the workshop template's own worked example of the most commonly misclassified TUM distinction"
        common_misclassification: "Left as OD by default because FMS's default threshold-based auto-classification does not distinguish 'brief inherent wait' from 'extended wait due to a management/equipment decision' — duration alone is not sufficient to classify correctly"
        escalation_path: "Mine controller must actively override the FMS default classification; no escalation beyond mine controller is defined in the pillar model"

    grain_statement: "Each row represents one complete haul cycle — one truck's trip from queuing at the shovel through return to the next assigned face — for one truck, at one site, per shift."
    grain_confirmed_by: "TBC — not confirmed by a named authority; training mock"
    grain_status: "needs-workshop"

  - entity_name: "haul_cycle_stage_event"
    primary_business_event: "Haul Cycle Stage Completed"
    event_timestamp_source: "FMS state-transition event stream (unconfirmed) or derived from haul_cycle"
    event_timestamp_field: "end_ts"

    measures:
      - measure_name: "Stage Duration"
        business_definition: "The elapsed time of one lifecycle stage (queue-shovel, spot-shovel, load, haul, queue-dump, spot-dump, dump, or empty-return) within one haul cycle."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: "Additive within a haul_cycle (the 8 stage durations sum to Total Cycle Duration) and additive across cycles when grouped by stage_type — e.g. 'total queue-at-shovel seconds this shift'."
        source_system: "FMS state-transition event stream (unconfirmed) or derived from haul_cycle timestamps"
        source_field: "end_ts − start_ts"
        raw_or_computed: "computed"
        computation_rule: "end_ts minus start_ts for the given stage_type"
        business_rule_notes: "This entity exists specifically so every duration used elsewhere (haul_cycle's measures, the TUM classification rules) is traceable to an explicit start/end boundary rather than an opaque pre-computed number."
        open_items: ["Whether this is a real source event stream or a derived/synthetic entity is unconfirmed — see open_items OI-002"]
        status: "needs-workshop"

    reason_code_vocabulary: []

    tum_classification_rules:
      - observable_condition: "stage_type = load, on the shovel's equipment_id"
        correct_tum_category: "PT"
        decision_authority: "FMS auto-classification by stage_type and equipment role"
        common_misclassification: "None documented at this grain — misclassification risk moves downstream to whether a stage's boundary timestamps are correct, not which TUM category the stage_type implies"
        escalation_path: "n/a at this grain"
      - observable_condition: "stage_type = load, on the truck's equipment_id"
        correct_tum_category: "WT"
        decision_authority: "FMS auto-classification by stage_type and equipment role"
        common_misclassification: "None documented at this grain"
        escalation_path: "n/a at this grain"

    grain_statement: "Each row represents one lifecycle stage occurrence within one haul cycle, for one piece of equipment."
    grain_confirmed_by: "TBC — not confirmed by a named authority; proposed entity, training mock"
    grain_status: "needs-workshop"

  - entity_name: "delay_event"
    primary_business_event: "Equipment Delay Recorded"
    event_timestamp_source: "FMS (queue/delay tracking)"
    event_timestamp_field: "delay_start_utc"

    measures:
      - measure_name: "Delay Duration"
        business_definition: "The elapsed time of one discrete delay occurrence for one equipment unit."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "delay_end_utc − delay_start_utc"
        raw_or_computed: "computed"
        computation_rule: "delay_end_utc minus delay_start_utc"
        business_rule_notes: "Additive within a tum_category grouping (e.g. total OD seconds per equipment per shift) — this is the atomic measure the Section 7 TUM KPIs are built from."
        open_items: []
        status: "confirmed"

    reason_code_vocabulary:
      - code: "TBC"
        teck_label: "Delay reason code vocabulary below TUM category level (e.g. specific breakdown causes, specific SBO triggers)"
        standard_mapping: "Not enumerated in the pillar model — explicitly flagged there as Known Gap G1: 'Delay reason code library below TUM category level not enumerated — Teck-specific codes required'"
        standard_reference: "GMG TUM — parent categories only (CT/ST/AT/OT/WT/PT/NP/OD/SBO/DT/UT/SBE) are standardized; sub-codes are site-specific"
        sites_applicable: ["HVC", "QB"]
        notes: "This is a real, pre-existing gap in the pillar model itself (Gap G1), not something this mock introduces. A real workshop must elicit the actual site-standard delay reason code list from FMS configuration."

    tum_classification_rules:
      - observable_condition: "Equipment stopped due to mechanical failure or breakdown, maintenance dispatched"
        correct_tum_category: "DT"
        decision_authority: "Mine controller, on notification from operator or automated fault code"
        common_misclassification: "Logged without a work_order_id linkage — Gap XP-01 in the programme Gap Register: 'FMS mine controllers classify TUM:DT without entering a work order number,' which breaks the ability to explain why equipment was down"
        escalation_path: "Should trigger EAM/CMMS work order creation (Pillar 5) — linkage not currently enforced; see open_items OI-003"
      - observable_condition: "Extended equipment idle period outside the mine plan (e.g. no operator assigned, shift understaffed) where equipment is otherwise mechanically available"
        correct_tum_category: "SBE"
        decision_authority: "Mine controller"
        common_misclassification: "Confused with SBO — SBE is external/not-required-by-plan standby (e.g. no operator, seasonal closure per the pillar model's Red Dog example), SBO is a management decision to hold equipment that IS part of the active plan"
        escalation_path: "Mine controller judgment call; no further escalation defined in the pillar model"

    grain_statement: "Each row represents one discrete delay occurrence for one equipment unit, bounded by delay_start_utc and delay_end_utc."
    grain_confirmed_by: "TBC — not confirmed by a named authority; training mock"
    grain_status: "needs-workshop"

  - entity_name: "stockpile_inventory_movement"
    primary_business_event: "Stockpile Inventory Movement Recorded"
    event_timestamp_source: "FMS"
    event_timestamp_field: "movement_timestamp_utc"

    measures:
      - measure_name: "Movement Mass"
        business_definition: "The mass added to or drawn down from a stockpile zone in one movement event."
        unit_of_measure: "tonnes"
        uom_suffix: "_dmt"
        additivity: "additive"
        additivity_notes: "Additive within a stockpile_zone_id and movement_type grouping; sign convention (addition positive, drawdown negative, or a separate signed field) not yet decided — open item."
        source_system: "FMS"
        source_field: "mass_t"
        raw_or_computed: "raw"
        computation_rule: ""
        business_rule_notes: "Dry tonnes (_dmt) assumed for stockpile accounting per standard metallurgical accounting convention — not independently confirmed in this mock."
        open_items: ["Addition/drawdown sign convention not confirmed"]
        status: "provisional"

    reason_code_vocabulary: []
    tum_classification_rules: []

    grain_statement: "Each row represents one atomic stockpile inventory movement — one addition (haul cycle dump) or one drawdown (reclaim) — for one stockpile zone."
    grain_confirmed_by: "TBC — not confirmed by a named authority; training mock"
    grain_status: "needs-workshop"

  - entity_name: "operator_shift_assignment"
    primary_business_event: "Operator Assigned to Equipment for Shift"
    event_timestamp_source: "FMS"
    event_timestamp_field: "assignment_start_utc"

    measures:
      - measure_name: "Assignment Duration"
        business_definition: "The elapsed time one operator is assigned to one piece of equipment within one shift."
        unit_of_measure: "seconds"
        uom_suffix: "_sec"
        additivity: "additive"
        additivity_notes: ""
        source_system: "FMS"
        source_field: "assignment_end_utc − assignment_start_utc"
        raw_or_computed: "computed"
        computation_rule: "assignment_end_utc minus assignment_start_utc"
        business_rule_notes: "Not itself TUM-classified — this entity establishes who is accountable for the equipment's TUM-classified time during the assignment window, not a TUM state itself."
        open_items: []
        status: "confirmed"

    reason_code_vocabulary: []
    tum_classification_rules: []

    grain_statement: "Each row represents one operator's assignment to one piece of equipment for one shift."
    grain_confirmed_by: "TBC — not confirmed by a named authority; training mock"
    grain_status: "needs-workshop"

