# ============================================================================
## SECTION 7: CONTEXTUALIZED DIMENSIONAL MODEL — NON-STANDARD, TRAINING ONLY
# ============================================================================
# NOT part of templates/beam-overlay-schema.yaml. NOT produced by validate-overlay's
# schema checks (it has nothing to check this against). Included here, at explicit
# request, specifically to show a training audience how named industry KPIs are built
# on top of the Curated atomic measures in Sections 1-6 above.
#
# CLAUDE.md is explicit that KPI definitions/metric calculations belong to Stage 2
# (teck-data-modeling), not this repo. This section exists here only because this run
# was explicitly framed as a mock for a training exercise, not a real deliverable.
#
# REVISION (this pass): the first version of this section jumped straight from
# delay_event/haul_cycle to KPI formulas, with no explicit dimensional model in between —
# no fact table, no conformed dimensions, "grain" stated as prose rather than a real
# structure. This revision "doubles back" on that, per the request: it defines the base
# TUM metrics (category durations, not just roll-up KPIs) as first-class fact-table
# measures, at an explicit minimal analytical grain, with conformed dimensions, so the
# derivation from atomic Curated data -> intermediate metric -> named KPI is a real,
# traceable chain rather than a formula asserted in prose.
#
# MINIMAL ANALYTICAL GRAIN (as directed): site, shift, equipment, operator.
# LOCATION DECISION (asked for explicitly, answered here — not just conversationally):
#   - NOT included in the required grain for TUM availability/reliability metrics.
#     Equipment state (available / operating / down / delayed) is a property of the
#     equipment's time over a shift, not its spatial position — "Physical Availability by
#     location" is not a naturally meaningful slice the way "by shift" or "by operator" is.
#   - IS carried as an OPTIONAL, degenerate dimension on fct_equipment_time_usage instead
#     of being omitted outright, because haul_cycle_stage_event already has location
#     context implicitly (queue_shovel vs. queue_dump are different physical places), so a
#     delay-location drill-down has real underlying data — just not required for the
#     headline KPIs.
#   - IS a first-class, REQUIRED dimension on fct_material_movement. haul_cycle already
#     carries destination_location_id, and "how much moved to which stockpile/waste dump"
#     is operationally central, not an edge case — this one was a real gap in the first
#     version, not a judgment call.
#
# GMG TUM hierarchy used below is a best-effort reconstruction from the twelve category
# codes the pillar model itself uses (CT/ST/AT/OT/WT/PT/NP/OD/SBO/DT/UT/SBE) — the pillar
# model defines the codes as an enum but does not spell out their parent/child tree. This
# hierarchy has NOT been verified against the published GMG Time Usage Model guideline and
# should be checked before being treated as authoritative. dim_tum_category below encodes
# it as an explicit parent/child table specifically so the KPI formulas are correct
# regardless of whether source data assigns only leaf codes (most likely) or sometimes the
# roll-up codes directly:
#
#   Calendar Time (CT)
#   ├── Available Time (AT)
#   │   ├── Operating Time (OT)
#   │   │   ├── Working Time (WT)      — productive function, truck-side (haul/dump/load)
#   │   │   ├── Productive Time (PT)   — productive function, shovel/drill-side
#   │   │   ├── Non-Productive Op. (NP) — tramming, spotting
#   │   │   ├── Operating Delay (OD)   — brief, inherent wait
#   │   │   └── Standby Operating (SBO) — management-decision wait, equipment in plan
#   │   └── Standby External (SBE)     — outside the mine plan (no operator, seasonal closure)
#   └── Down Time (DT)
#       ├── Scheduled Down Time (ST)   — planned maintenance
#       └── Unscheduled Down Time (UT) — breakdown/failure
# ============================================================================

## 7.1 — DIMENSIONS (conformed where noted; new where not)

contextualized_dimensions:

  - dimension_name: "dim_site"
    conformed_from: "n/a — new, small reference dimension (site codes already used throughout this overlay: HVC, QB)"
    grain: "One row per site"
    key_attributes: ["site_code (PK)", "site_name", "region"]
    notes: "Trivial dimension; included because it's part of the directed minimal grain, not because it needs elaboration."

  - dimension_name: "dim_shift"
    conformed_from: "Curated entity `shift` (Section 2/3 above) — same natural key, no redesign needed"
    grain: "One row per shift instance per site"
    key_attributes: ["shift_id (PK)", "shift_date", "shift_type", "site_code (FK)", "shift_start_utc", "shift_end_utc"]
    notes: "Chosen as the temporal grain per the direction given (site, shift, equipment, operator) — no separate dim_date was added; shift_date already carries the day-level grain a calendar dimension would provide, and adding one would exceed the stated scope."

  - dimension_name: "dim_equipment"
    conformed_from: "Curated entity `mobile_equipment` (Section 2 above)"
    grain: "One row per governed physical equipment unit"
    key_attributes: ["equipment_master_id (PK)", "fleet_number", "equipment_class", "make", "model", "nominal_payload_t"]
    notes: "IMPORTANT CROSS-REFERENCE: this dimension is only as trustworthy as the Minestar/Wenco mastering gap (open_items OI-009) being resolved. A Contextualized-layer equipment dimension built today would silently inherit that unresolved identity ambiguity — flagged again here so it isn't lost between sections."

  - dimension_name: "dim_operator"
    conformed_from: "Curated entity `operator` (Section 2 above)"
    grain: "One row per person per role"
    key_attributes: ["operator_id (PK)", "operator_name", "authorization_classes", "employment_type"]
    notes: "Same PII governance flag as the Curated entity (Section 4 dimension_candidates governance_notes) — carries forward, not re-litigated here."

  - dimension_name: "dim_tum_category"
    conformed_from: "NEW — not present in the standard pillar model or the first version of this section. Encodes the hierarchy diagrammed above as data, not just prose."
    grain: "One row per GMG TUM category code"
    key_attributes: ["tum_category_code (PK)", "category_label", "parent_category_code (FK to self; null for CT)", "is_productive (bool)", "standard_alignment"]
    notes: "Required so KPI formulas can filter 'all leaf codes under OT' etc. without hardcoding a category list in every formula. Same GMG-verification caveat as the hierarchy diagram above."

  - dimension_name: "dim_material_type"
    conformed_from: "NEW small reference dimension — material_type values already exist on haul_cycle (Section 2/3) but were never formalized as their own dimension"
    grain: "One row per material classification"
    key_attributes: ["material_type_code (PK) — ore | waste | marginal", "material_type_label"]
    notes: ""

  - dimension_name: "dim_location"
    conformed_from: "Curated entity `location` (Section 2 above)"
    grain: "One row per named destination node"
    key_attributes: ["location_id (PK)", "location_name", "location_type"]
    notes: "REQUIRED dimension on fct_material_movement; OPTIONAL/degenerate on fct_equipment_time_usage — see the location decision note above. This dual role is itself worth surfacing to a training audience: the same conformed dimension can be mandatory in one fact and optional in another, and that's a normal, correct outcome, not an inconsistency."

## 7.2 — FACTS (the base metrics — this is what the first version of this section skipped)

contextualized_facts:

  - fact_name: "fct_equipment_time_usage"
    grain_statement: "One row per (site, shift, equipment, operator, tum_category) — optionally further split by location for delay drill-down. This is the base TUM metric fact every availability and reliability KPI below is computed from."
    dimensions: ["dim_site", "dim_shift", "dim_equipment", "dim_operator", "dim_tum_category", "dim_location (optional/degenerate)"]
    measures:
      - measure_name: "duration_s"
        business_definition: "Total seconds of that TUM category accumulated by that equipment/operator/shift, summed from delay_event and haul_cycle_stage_event."
        additivity: "additive"
        source: "SUM(delay_event.duration_s) + SUM(haul_cycle_stage_event.duration_s) grouped by (site, shift, equipment, operator, tum_category)"
      - measure_name: "episode_count"
        business_definition: "Count of discrete delay_event/haul_cycle_stage_event rows contributing to duration_s for that grain cell — added specifically so MTBS and MTTR (which need an event COUNT, not just a summed duration) are computable directly from this fact without a separate query against the atomic entities."
        additivity: "additive"
        source: "COUNT(delay_event rows) + COUNT(haul_cycle_stage_event rows) grouped the same way"
    etl_notes:
      - "operator attribution is NOT direct: delay_event does not carry operator_id. It must be derived via a time-window join against operator_shift_assignment (equipment_id + shift_id -> operator_id). A delay_event spanning a mid-shift operator swap cannot be cleanly attributed to one operator — flag as an open item when this is built for real, not silently assigned to whichever operator happens to join first."
      - "Data-quality check, not just a formula: SUM(duration_s) across ALL tum_category rows for one (site, shift, equipment, operator) should equal that shift's elapsed wall-clock duration. A shortfall means unclassified or missing time — this equality is exactly the GMG TUM promise (every second is classified into some category), and it's directly testable against this fact table."
    status: "illustrative — proposed structure, not built or validated against real data"

  - fact_name: "fct_material_movement"
    grain_statement: "One row per (site, shift, equipment, operator, material_type, destination_location). Destination location is a required part of this grain — see the location decision note above."
    dimensions: ["dim_site", "dim_shift", "dim_equipment", "dim_operator", "dim_material_type", "dim_location (required)"]
    measures:
      - measure_name: "payload_t"
        business_definition: "Mass delivered, summed from haul_cycle.payload_est_t."
        additivity: "additive"
        source: "SUM(haul_cycle.payload_est_t) grouped by (site, shift, truck_id, operator, material_type, destination_location_id)"
      - measure_name: "cycle_count"
        business_definition: "Count of haul_cycle rows contributing to payload_t for that grain cell."
        additivity: "additive"
        source: "COUNT(haul_cycle rows), same grouping"
    etl_notes:
      - "truck_id (not shovel_id) is the equipment attribution for this fact — a haul_cycle's payload belongs to the truck that delivered it, not the shovel that loaded it. If shovel-side loading productivity is needed later, that's a different fact at a different grain, not an overload of this one."
    status: "illustrative — proposed structure, not built or validated against real data"

## 7.3 — KPIs (now expressed against the facts above, not asserted in prose)

contextualized_kpis:

  - kpi_name: "Physical Availability (PA)"
    business_definition: "The proportion of calendar time equipment is mechanically available for use, whether or not it is actually operated."
    formula: "PA = SUM(fct_equipment_time_usage.duration_s WHERE tum_category NOT under DT) / SUM(fct_equipment_time_usage.duration_s, all categories)"
    fact_table: "fct_equipment_time_usage"
    grain: "site, shift, equipment, operator (rolls up over tum_category — the fact's finer grain — via the WHERE/no-WHERE sums)"
    status: "illustrative — GMG TUM hierarchy above not independently verified"

  - kpi_name: "Operational Availability / Use of Availability (UofA)"
    business_definition: "The proportion of available time equipment is actually placed into operation, whether productively or not."
    formula: "UofA = SUM(duration_s WHERE tum_category under OT) / SUM(duration_s WHERE tum_category NOT under DT)"
    fact_table: "fct_equipment_time_usage"
    grain: "site, shift, equipment, operator"
    status: "illustrative — GMG TUM hierarchy above not independently verified"

  - kpi_name: "Effective Utilization / Effective Use of Availability (EU)"
    business_definition: "The proportion of calendar time equipment spends in genuinely productive operation (excludes non-productive operating time and delays even while nominally 'operating')."
    formula: "EU = SUM(duration_s WHERE tum_category IN ('WT','PT')) / SUM(duration_s, all categories)"
    fact_table: "fct_equipment_time_usage"
    grain: "site, shift, equipment, operator"
    status: "illustrative — GMG TUM hierarchy above not independently verified"

  - kpi_name: "Mean Time Between Failures (MTBF)"
    business_definition: "Average operating time between unscheduled failure events for a piece of equipment."
    formula: "MTBF = SUM(duration_s WHERE tum_category NOT under DT) / SUM(episode_count WHERE tum_category = 'DT' AND [cross-pillar: linked work_order.failure_type = unscheduled])"
    fact_table: "fct_equipment_time_usage — INCOMPLETE without a Pillar 5 work_order join for the unscheduled/scheduled split"
    grain: "site, shift, equipment, operator"
    status: "illustrative — CROSS-PILLAR, cannot be fully computed from this overlay's facts alone; deliberately left incomplete to illustrate the boundary (see open_items OI-003 / Gap XP-01)"

  - kpi_name: "Mean Time Between Shutdowns (MTBS)"
    business_definition: "Average operating time between any stoppage event, scheduled or unscheduled."
    formula: "MTBS = SUM(duration_s WHERE tum_category NOT under DT) / SUM(episode_count WHERE tum_category = 'DT')"
    fact_table: "fct_equipment_time_usage"
    grain: "site, shift, equipment, operator"
    status: "illustrative — NOW fully computable from fct_equipment_time_usage alone (the episode_count measure is what makes this work; the first version of this section didn't have a count measure at all)"

  - kpi_name: "Mean Time To Repair (MTTR)"
    business_definition: "Average duration of a down-time event from failure to return-to-service."
    formula: "MTTR = SUM(duration_s WHERE tum_category = 'DT') / SUM(episode_count WHERE tum_category = 'DT')"
    fact_table: "fct_equipment_time_usage"
    grain: "site, shift, equipment, operator"
    status: "illustrative — fully computable from fct_equipment_time_usage for the duration math; true failure-mode attribution (WHY it took that long) still requires the Pillar 5 work_order linkage"

  - kpi_name: "Total Material Moved"
    business_definition: "Total mass delivered across all haul cycles in a period, all material types."
    formula: "Total Material Moved = SUM(fct_material_movement.payload_t)"
    fact_table: "fct_material_movement"
    grain: "site, shift, equipment, operator, destination_location (material_type unfiltered)"
    status: "illustrative — fully computable from this overlay's facts alone, no cross-pillar dependency; the cleanest example here"

  - kpi_name: "Ore Moved / Waste Moved"
    business_definition: "Total mass delivered, split by material classification."
    formula: "Ore Moved = SUM(payload_t WHERE material_type = 'ore'); Waste Moved = SUM(payload_t WHERE material_type = 'waste')"
    fact_table: "fct_material_movement"
    grain: "site, shift, equipment, operator, destination_location"
    status: "illustrative — fully computable from this overlay's facts alone. material_type classification itself originates in Pillar 2 process area 2.1 (Drill & Blast, material_classification entity) — referenced, not owned, by this Load & Haul product."

  - kpi_name: "Strip Ratio"
    business_definition: "The ratio of waste material moved to ore material moved — a standard open-pit productivity/economics indicator."
    formula: "Strip Ratio = Waste Moved / Ore Moved"
    fact_table: "fct_material_movement"
    grain: "site, shift, equipment, operator, destination_location"
    status: "illustrative — fully computable from this overlay's facts alone"
