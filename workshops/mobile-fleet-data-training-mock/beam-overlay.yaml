## SECTION 4: DIMENSION CANDIDATES

dimension_candidates:
  - entity_name: "mobile_equipment"
    conformed_candidate: "yes"
    conformed_rationale: "Shared across every Pillar 2 process area (Drill & Blast, Load & Haul, Mine Services) and referenced by Pillar 5 (work_order, condition monitoring) per the pillar model's own Cross-Pillar Dependencies section — a textbook conformed dimension, on the condition below."
    cross_product_usage: ["Any Pillar 2 data product", "Pillar 5 maintenance/reliability products"]
    governance_notes: "UPDATED during this refresh: being 'conformed' across Pillars 2 and 5 now depends on the Minestar/Wenco mastering gap being resolved first (standards/teck-vocabulary-master.md §3.5) — a conformed dimension built on an ungoverned, duplicate-carrying identity is not actually safe to conform, it just propagates the ambiguity to every consumer. The single designated data steward this entity needs is now specifically the joint product-team + site-steward role that maintains the new governed master file and mobile_equipment_source_xref — not yet assigned."

  - entity_name: "operator"
    conformed_candidate: "yes"
    conformed_rationale: "Referenced across all Pillar 2 process areas for shift-level accountability."
    cross_product_usage: ["Any Pillar 2 data product"]
    governance_notes: "Contains PII (operator_name, employment_type) — access governance review required before treating as a freely conformed dimension across products; flagged, not resolved, in this mock."

  - entity_name: "location"
    conformed_candidate: "yes"
    conformed_rationale: "Destination nodes (crusher, stockpile, waste dump) are referenced by Load & Haul and consumed downstream by Pillar 3 (Processing) at the crusher handoff."
    cross_product_usage: ["Pillar 3 Processing & Beneficiation products"]
    governance_notes: ""

  - entity_name: "shift"
    conformed_candidate: "yes"
    conformed_rationale: "The universal temporal grain across the entire programme per the pillar model's own note that shift is the GMG TUM Calendar Time boundary."
    cross_product_usage: ["Every pillar's data products"]
    governance_notes: "Shift boundary/timezone handling by site is unresolved — see open_items — and should be resolved before this dimension is treated as safely conformed across sites."

  - entity_name: "equipment_class"
    conformed_candidate: "candidate"
    conformed_rationale: "Likely conformed across Pillar 2 and Pillar 5, but capacity/classification standards may be Pillar-5-maintained (asset hierarchy) rather than Pillar-2-owned — ownership not resolved in this mock."
    cross_product_usage: ["Pillar 5 asset hierarchy, if aligned"]
    governance_notes: ""

